<body>

      <symbol id="i-subjects" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2z"/><path d="M4 20a2 2 0 0 0 2 1h13v-3"/><path d="M8 7h7"/></symbol>

      <symbol id="i-exams" viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4.5L17 13H5"/></symbol>

      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>

      <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
      <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c.8 3.8 5.5 5.8 5.5 10.7A5.6 5.6 0 0 1 12 19.5a5.6 5.6 0 0 1-5.5-5.8c0-2.7 1.7-4.2 2.7-5.7.2 2 1.1 3.1 2.2 3.1C11.4 8.6 11.2 5.8 12 3z"/></symbol>

      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>

  <div class="app">
    <nav class="rail" aria-label="Main">
      <a class="brand" href="#today"><svg class="logo" aria-hidden="true"><use href="#i-logo"></use></svg><span>Study Grove</span></a>
      <div class="nav-links">
        <a href="#today" data-route="today"><svg class="ic" aria-hidden="true"><use href="#i-today"></use></svg><span>Today</span></a>
        <a href="#subjects" data-route="subjects"><svg class="ic" aria-hidden="true"><use href="#i-subjects"></use></svg><span>Subjects</span></a>
        <a href="#reviews" data-route="reviews"><svg class="ic" aria-hidden="true"><use href="#i-reviews"></use></svg><span>Reviews</span><b class="nav-badge" data-badge="reviews" hidden></b></a>
        <a href="#exams" data-route="exams"><svg class="ic" aria-hidden="true"><use href="#i-exams"></use></svg><span>Exams</span></a>
        <a href="#stats" data-route="stats"><svg class="ic" aria-hidden="true"><use href="#i-stats"></use></svg><span>Stats</span></a>
      </div>
      <div class="rail-foot">
        <div class="level">
          <div class="level-top"><span>Level <b id="level-num">1</b></span><span id="level-xp" class="muted"></span></div>
          <div class="bar"><span id="level-bar"></span></div>
        </div>
        <a href="#settings" data-route="settings" class="rail-settings"><svg class="ic" aria-hidden="true"><use href="#i-settings"></use></svg><span>Settings</span></a>
      </div>
    </nav>

    <main id="main" class="main">
      <header class="topbar">
        <div class="hello">
          <h1 id="greeting">Good day</h1>
          <p id="subline" class="muted"></p>
        </div>
        <div class="top-tools">
          <a id="timer-pill" class="timer-pill" href="#today" hidden><b>25:00</b><span>Focus</span></a>
          <span id="streak-chip" class="streak-chip"></span>
          <a href="#settings" class="btn-icon top-settings" aria-label="Settings"><svg class="ic" aria-hidden="true"><use href="#i-settings"></use></svg></a>
        </div>
      </header>

      <section id="hero" class="hero" aria-label="Your grove and focus timer">
        <div id="grove-panel" class="grove-panel">
          <div id="grove" class="grove" data-sky="day"></div>
          <p id="tree-count" class="grove-caption"></p>
          <div id="tree-tip" class="tree-tip" role="status" hidden></div>
        </div>
        <div id="timer-card" class="card timer-card"></div>
      </section>

      <div id="view" class="view"></div>
    </main>

    <nav class="tabbar" aria-label="Main">
      <a href="#today" data-route="today"><svg class="ic" aria-hidden="true"><use href="#i-today"></use></svg><span>Today</span></a>
      <a href="#subjects" data-route="subjects"><svg class="ic" aria-hidden="true"><use href="#i-subjects"></use></svg><span>Subjects</span></a>
      <a href="#reviews" data-route="reviews"><svg class="ic" aria-hidden="true"><use href="#i-reviews"></use></svg><span>Reviews</span><b class="nav-badge" data-badge="reviews" hidden></b></a>
      <a href="#exams" data-route="exams"><svg class="ic" aria-hidden="true"><use href="#i-exams"></use></svg><span>Exams</span></a>
      <a href="#stats" data-route="stats"><svg class="ic" aria-hidden="true"><use href="#i-stats"></use></svg><span>Stats</span></a>
    </nav>
  </div>

  <div id="focus" class="focus" hidden>
    <div id="focus-ui" class="focus-ui"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <canvas id="burst" class="burst" aria-hidden="true"></canvas>

  <script type="module" src="js/app.js"></script>
</body>
</html>
